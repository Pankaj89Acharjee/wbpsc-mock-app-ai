<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <rect width="1200" height="540" rx="20" fill="#020617" />

  <text x="50" y="52" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">
    3-Layer Anti-Duplication Pipeline &amp; Deterministic SQL Evaluation Architecture
  </text>
  <text x="50" y="80" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">
    How WBPSC Mock Tutor prevents repetitive questions and grades 100-question tests in &lt;25ms with zero AI cost
  </text>

  <!-- Top Row: 3-Layer Deduplication -->
  <rect x="50" y="108" width="340" height="185" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="72" y="140" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">
    LAYER 1 · PROMPT AVOIDANCE
  </text>
  <text x="72" y="168" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
    Existing Stem Injection
  </text>
  <text x="72" y="196" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    Before calling Gemini, api-core queries up to
  </text>
  <text x="72" y="216" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    80 existing stems in that subtopic/subject and
  </text>
  <text x="72" y="236" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    instructs AI to test completely different facts.
  </text>

  <rect x="430" y="108" width="340" height="185" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
  <text x="452" y="140" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">
    LAYER 2 · SHA-256 CONTENT HASH
  </text>
  <text x="452" y="168" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
    Order-Independent Fingerprint
  </text>
  <text x="452" y="196" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    Normalizes English stem + sorted A/B/C/D options
  </text>
  <text x="452" y="216" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    into a 64-char SHA-256 hash. Enforced by a
  </text>
  <text x="452" y="236" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    UNIQUE index in PostgreSQL (questions table).
  </text>

  <rect x="810" y="108" width="340" height="185" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="832" y="140" fill="#c4b5fd" font-family="monospace" font-size="13" font-weight="700">
    LAYER 3 · PG_TRGM + PGVECTOR
  </text>
  <text x="832" y="168" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
    Fuzzy &amp; Semantic Deduplication
  </text>
  <text x="832" y="196" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    PostgreSQL pg_trgm similarity() + option-set
  </text>
  <text x="832" y="216" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    overlap rejects reworded clones (&gt;55% match),
  </text>
  <text x="832" y="236" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">
    while pgvector powers semantic RAG retrieval.
  </text>

  <!-- Bottom Row: Deterministic SQL Grading Flow -->
  <rect x="50" y="320" width="1100" height="185" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="74" y="354" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">
    DETERMINISTIC SINGLE-TRANSACTION SQL GRADING ENGINE (POST /exams/submit)
  </text>
  <text x="74" y="384" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">
    1. Fetch Official Key → 2. Compute +M / −N Net Score → 3. Upsert Subtopic Mastery → 4. Rank Weaknesses
  </text>
  <text x="74" y="416" fill="#cbd5e1" font-family="monospace" font-size="13">
    • Accuracy &lt; 50%  ==&gt;  CRITICAL_WEAKNESS (Triggers 3-Tier Cached AI Note: Redis L1 → Postgres L2 → Gemini L3)
  </text>
  <text x="74" y="444" fill="#cbd5e1" font-family="monospace" font-size="13">
    • Avg Time &gt; Expected Benchmark  ==&gt;  HIGH_TIME_TAKEN (Boosts Weakness Priority Score for Remedial Mock)
  </text>
  <text x="74" y="472" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700">
    • Result: 100% Mathematically Exact Marks, Zero Hallucinations, Zero AI API Cost on Exam Submission!
  </text>
</svg>
